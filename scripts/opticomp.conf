# ============================================================
# OptiComp - VirtualHost Apache2 para Ubuntu Server
# Archivo: /etc/apache2/sites-available/opticomp.conf
# Activar con: sudo a2ensite opticomp.conf && sudo systemctl reload apache2
# ============================================================

<VirtualHost *:80>
    ServerName opticomp.local
    ServerAlias _default_

    # Raíz del DocumentRoot apuntando al Front Controller
    DocumentRoot /var/www/html/OptiComp/public

    # ── Directorio público: acceso permitido ──────────────────
    <Directory /var/www/html/OptiComp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Directorio SOAP: acceso permitido ─────────────────────
    <Directory /var/www/html/OptiComp/public/soap>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # ── Resto del proyecto: denegado desde web ────────────────
    # (app/, config/, database/, logs/ no accesibles por HTTP)
    <Directory /var/www/html/OptiComp>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # Re-permitir /public dentro del bloque negado
    <Directory /var/www/html/OptiComp/public>
        Require all granted
    </Directory>

    # ── Logs de Apache específicos del proyecto ───────────────
    ErrorLog  ${APACHE_LOG_DIR}/opticomp_error.log
    CustomLog ${APACHE_LOG_DIR}/opticomp_access.log combined

    # ── PHP: permitir SOAP en producción ─────────────────────
    <IfModule mod_php.c>
        php_value soap.wsdl_cache_enabled 0
        php_value display_errors Off
        php_value log_errors On
    </IfModule>

</VirtualHost>
